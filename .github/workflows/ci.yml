# Workflow de Integração Contínua responsável exclusivamente pela execução dos testes unitários.
# Estrutura preparada para inclusão futura de novos jobs e etapas de validação.

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '22'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências definidas no yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código-fonte do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura a versão do Node.js utilizada pelo projeto
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências definidas no yarn.lock
      - name: Install dependencies
        run: yarn install

      # 5. Baixa as configurações do projeto Vercel (.vercel/project.json)
      - name: Vercel Pull
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      # 6. Build para o Vercel
      - name: Vercel Build
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy preview no Vercel
      - name: Deploy Preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN
