# Pipeline com testes unitários, Preview isolado, testes E2E e deploy de produção.
name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_SCOPE: marcio-costa1
  PREVIEW_SUPABASE_PROJECT_ID: htqzbjfjpvfossfrjtao
  PRODUCTION_SUPABASE_PROJECT_ID: syiwyoifcalpenetbqzn

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Verify Vercel authentication
        run: yarn vercel whoami --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      # Busca as variáveis configuradas para Preview.
      - name: Pull Preview Config
        run: yarn vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      # Bloqueia um Preview com variáveis do Supabase de produção.
      - name: Validate Preview Supabase
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { parseEnv } = require('node:util')
          const vars = parseEnv(fs.readFileSync('.vercel/.env.preview.local', 'utf8'))
          const ref = process.env.PREVIEW_SUPABASE_PROJECT_ID
          if (
            vars.VITE_SUPABASE_URL !== `https://${ref}.supabase.co` ||
            vars.VITE_SUPABASE_PROJECT_ID !== ref ||
            !vars.VITE_SUPABASE_PUBLISHABLE_KEY
          ) {
            throw new Error('Preview não está configurado para o Supabase Preview!')
          }
          console.log('Supabase Preview validado.')
          NODE

      - name: Build Preview
        run: yarn vercel build --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      # Captura a URL real retornada pela Vercel.
      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")
          if [[ ! "$URL" =~ ^https://[^[:space:]]+\.vercel\.app/?$ ]]; then
            echo "Erro: deploy Preview não retornou uma URL Vercel válida." >&2
            exit 1
          fi
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed at: $URL"

  e2e-tests:
    name: Run E2E Tests
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      # Bloqueia conexões PostgreSQL fora do Supabase Preview.
      - name: Validate E2E Database Target
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          node <<'NODE'
          const ref = process.env.PREVIEW_SUPABASE_PROJECT_ID
          const rawUrl = process.env.DATABASE_URL
          if (!rawUrl) throw new Error('PREVIEW_DATABASE_URL não foi configurado no GitHub!')

          const connection = new URL(rawUrl)
          const direct =
            connection.hostname === `db.${ref}.supabase.co` &&
            connection.username === 'postgres'
          const pooler =
            connection.hostname.endsWith('.pooler.supabase.com') &&
            connection.username === `postgres.${ref}`

          if (!['postgres:', 'postgresql:'].includes(connection.protocol) || (!direct && !pooler)) {
            throw new Error('DATABASE_URL não pertence ao Supabase Preview!')
          }
          console.log('Destino do banco E2E validado: Supabase Preview.')
          NODE

      - name: Run E2E regression tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment_url }}
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

  deploy-production:
    name: Deploy Production
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Seleciona as variáveis de produção para um novo build independente.
      - name: Pull Production Config
        run: yarn vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Validate Production Supabase
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { parseEnv } = require('node:util')
          const vars = parseEnv(fs.readFileSync('.vercel/.env.production.local', 'utf8'))
          const ref = process.env.PRODUCTION_SUPABASE_PROJECT_ID
          if (
            vars.VITE_SUPABASE_PROJECT_ID !== ref ||
            vars.VITE_SUPABASE_URL !== `https://${ref}.supabase.co` ||
            !vars.VITE_SUPABASE_PUBLISHABLE_KEY
          ) {
            throw new Error('Production não está configurado para o Supabase de produção!')
          }
          console.log('Supabase Production validado.')
          NODE

      - name: Build Production
        run: yarn vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Deploy Production
        run: yarn vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
